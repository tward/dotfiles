###############################################################################
# Behaviour
###############################################################################

# Set default shell
set-option -g default-shell $SHELL

# Use tmux-256color for proper clipboard and color support
set -g default-terminal "tmux-256color"

# OSC 52 clipboard — works over SSH, no pbcopy needed
set -s set-clipboard on

# Refresh these from the attaching client, on top of tmux's default list
# (DISPLAY, SSH_CONNECTION, SSH_AUTH_SOCK, ...). A server born inside an SSH
# login otherwise hands every later pane that login's SSH_CLIENT/SSH_TTY and
# no WAYLAND_DISPLAY, which breaks wl-paste (and Claude Code's image paste)
# for local attaches. Attaching from a local terminal sets or clears them to
# match it; attaching over SSH does the reverse.
set -ga update-environment "WAYLAND_DISPLAY SSH_CLIENT SSH_TTY"

# Enable mouse controls
set -g mouse on

setw -g mode-keys vi

setw -g xterm-keys on

# faster command sequences
set -s escape-time 10

# increase repeat timeout
set -sg repeat-time 600
set -s focus-events on

setw -q -g utf8 on

# # Increase default pane buffer size
set-option -g history-limit 10000

# start windows numbering at 1
set -g base-index 1

# make pane numbering consistent with windows
setw -g pane-base-index 1

# rename window to reflect current program
setw -g automatic-rename on

# renumber windows when a window is closed
set -g renumber-windows on

# set terminal title
set -g set-titles on

# slightly longer pane indicators display time
set -g display-panes-time 800

# slightly longer status messages display time
set -g display-time 1000

# redraw status line every 10 seconds
set -g status-interval 10

# activity - set quiet mode
setw -g monitor-activity off
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
set -g bell-action none

set-option -sa terminal-overrides ',*:RGB'
set-option -sa terminal-features ',xterm-256color:clipboard'

###############################################################################
# Resurrect
###############################################################################

set -g @resurrect-dir "$tmux_dir/resurrect"
set -g @resurrect-save "S"                          # Save the session
set -g @resurrect-restore "R"                       # Reload the session
# Continuum owns the default server only. A tool that runs its own tmux
# server on another socket (-S or -L) manages its own sessions, so never
# auto-restore a snapshot into it and never save one from it.
if-shell -F '#{m:*/tmux-*/default,#{socket_path}}' \
  'set -g @continuum-restore "on"' \
  'set -g @continuum-restore "off"'
if-shell -F '#{m:*/tmux-*/default,#{socket_path}}' \
  'set -g @continuum-save-interval "15"' \
  'set -g @continuum-save-interval "0"'
set -g @resurrect-strategy-nvim "session"           # Restore Neovim session if a Session.vim file is present