# Keep the PipeWire RAOP (AirPlay) discovery module installed but not loaded.
#
# Fedora enables RAOP via a system symlink:
#   /usr/share/pipewire/pipewire.conf.d/50-raop.conf -> ../pipewire.conf.avail/50-raop.conf
# which loads libpipewire-module-raop-discover whenever the `module.raop`
# property is not false. mDNS-discovered AirPlay receivers then appear as
# raop_sink.* nodes in the sink list.
#
# That discovery is what crashed swaync's volume slider: swaync walks the sink
# list on every get_sink_info callback, and a flaky remote raop_sink segfaulted
# the walk. Setting the gate to false leaves the module present on disk but never
# loaded, so no raop_sink appears.
#
# To re-enable for dev/testing: set `module.raop = true` below (or delete this
# file) and restart PipeWire:
#   systemctl --user restart pipewire pipewire-pulse wireplumber
context.properties = {
    module.raop = false
}
