- defaults:
    link:
      relink: true

- create:
    - ~/.local/bin

# Requires 4 space indentation or it will fail
- link:
    ~/.config/bat: bat
    ~/.fzfrc: fzfrc
    ~/.gitconfig: gitconfig
    ~/.gitignore_global: gitignore_global
    ~/.Brewfile: homebrew/Brewfile
    ~/.config/htop: htop
    ~/.config/kitty: kitty
    ~/.config/lazygit: lazygit
    ~/.config/nvim: neovim
    ~/.config/omniwm: omniwm
    ~/.config/ranger: ranger
    ~/.config/sketchybar: sketchybar
    ~/.config/skhd: skhd
    ~/.config/tmux: tmux
    ~/.config/yabai: yabai
    ~/.editorconfig: editorconfig
    ~/.zshenv: zshenv
    ~/.config/zsh: zsh

- shell:
    # dotbot hides command output unless asked; brew bundle can run for minutes,
    # so show it.
    - command: brew bundle --file=homebrew/Brewfile
      description: Installing Homebrew packages
      stdout: true
      stderr: true
    - ["test -d ~/.config/tmux/plugins/tpm || git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm", Installing TPM]
    - ["~/.config/tmux/plugins/tpm/bin/install_plugins", Installing tmux plugins]
