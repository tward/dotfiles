- defaults:
    link:
      relink: true

- create:
    - ~/.local/bin

# Requires 4 space indentation or it will fail
- link:
    ~/.config/bat: bat
    ~/.fzfrc: fzfrc
    ~/.gitconfig: gitconfig
    ~/.gitignore_global: gitignore_global
    ~/.config/htop: htop
    ~/.config/kitty: kitty
    ~/.config/lazygit: lazygit
    ~/.config/swaync: swaync
    ~/.config/niri: niri
    ~/.config/fuzzel: fuzzel
    ~/.config/swaylock: swaylock
    ~/.config/nvim: neovim
    ~/.config/ranger: ranger
    ~/.config/tmux: tmux
    ~/.config/waybar: waybar
    ~/.editorconfig: editorconfig
    ~/.zshenv: zshenv
    ~/.config/zsh: zsh
    ~/.local/bin/niri-raise-or-launch: scripts/niri-raise-or-launch
    ~/.local/bin/niri-polkit-agent: scripts/niri-polkit-agent
    ~/.local/bin/brave-profile: scripts/brave-profile
    ~/.local/bin/flatpak-kill-menu: scripts/flatpak-kill-menu
    ~/.local/bin/niri-quit-window: scripts/niri-quit-window
    ~/.local/bin/ddc-brightness: scripts/ddc-brightness
    ~/.local/bin/niri-display-mode: scripts/niri-display-mode

- shell:
    - ["test -d ~/.config/tmux/plugins/tpm || git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm", Installing TPM]
    - ["~/.config/tmux/plugins/tpm/bin/install_plugins || true", Installing tmux plugins]
