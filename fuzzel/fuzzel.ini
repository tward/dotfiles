# Nord-themed fuzzel launcher — matches waybar/swaync/swaylock.
# Launched by Mod+Space in niri (via niri-raise-or-launch). The translucent
# background + rounded corners mirror the floating waybar; the wallpaper blur
# behind the panel is applied compositor-side by a layer-rule in
# niri/config.kdl. fuzzel uses RGBA: the last two hex digits are alpha.
# The background MUST stay < ff alpha or niri's blur is fully hidden.

[main]
font=Hack Nerd Font:size=13
layer=overlay
horizontal-pad=20
vertical-pad=16
inner-pad=10

[border]
width=2
radius=12

[colors]
background=2e3440a8        # Nord0 @ 66% — same translucency as waybar
text=d8dee9ff              # Nord4
prompt=88c0d0ff            # Nord8 frost
placeholder=4c566aff       # Nord3 (muted)
input=eceff4ff             # Nord6
match=88c0d0ff             # Nord8 frost — matched substring
selection=434c5eff         # Nord2 — selected row bg
selection-text=eceff4ff    # Nord6
selection-match=8fbcbbff   # Nord7 frost
counter=81a1c1ff           # Nord9 (same as swaync .time)
border=88c0d0ff            # Nord8 frost — matches swaylock ring
