# Bitwig runs as a Flatpak, and WirePlumber's default policy grants Flatpak
# clients read+execute only ("rx") on PipeWire graph objects. A DAW also needs
# write to configure the device it opens (params, block size); without it Bitwig
# logs "no permission to call method" at device open (~/.BitwigStudio/log/engine.log).
# This grants full permissions to Bitwig specifically, leaving other Flatpaks restricted.
access.rules = [
  {
    matches = [
      { pipewire.access.portal.app_id = "com.bitwig.BitwigStudio" }
    ]
    actions = {
      update-props = {
        default_permissions = "all"
      }
    }
  }
]
